<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard — Premium Charcoal Co.</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --orange: #E8490F;
      --orange-hover: #c93d0c;
      --dark: #111111;
      --white: #ffffff;
      --gray-bg: #f4f4f4;
      --border: #e8e8e8;
      --text-dark: #1a1a1a;
      --text-muted: #888;
      --success: #22a85a;
    }

    html, body { height: 100%; font-family: 'Open Sans', sans-serif; }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: var(--gray-bg);
      color: var(--text-dark);
      visibility: hidden; /* revealed once Firebase confirms an admin session */
    }

    /* ── NAV (matches login.html / signup.html) ── */
    nav {
      background: var(--dark);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 48px;
      height: 68px;
      flex-shrink: 0;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--white);
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 1.05rem;
      text-decoration: none;
      white-space: nowrap;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-shrink: 0;
    }

    .nav-right a {
      color: rgba(255,255,255,0.8);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s;
      white-space: nowrap;
    }
    .nav-right a:hover { color: #fff; }

    .btn-logout-nav {
      border: 1.5px solid rgba(255,255,255,0.4);
      padding: 7px 18px;
      border-radius: 24px;
      font-weight: 600 !important;
      font-size: 0.85rem !important;
      transition: border-color 0.2s !important;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-logout-nav:hover { border-color: rgba(255,255,255,0.9) !important; color: #fff !important; }

    /* ── MAIN ── */
    .main {
      flex: 1;
      padding: 40px 48px 60px;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 32px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .topbar h1 {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 1.7rem;
    }
    .topbar p { color: var(--text-muted); font-size: 0.9rem; margin-top: 4px; }

    #whoami { font-size: 0.85rem; color: var(--text-muted); }
    #whoami b { color: var(--text-dark); }

    /* ── STAT CARDS ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: var(--white);
      border-radius: 14px;
      padding: 22px 24px;
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }

    .stat-card.hero {
      background: var(--dark);
      color: var(--white);
      border: none;
    }
    /* signature ember-glow accent, used once, on the headline stat */
    .stat-card.hero::before {
      content: "";
      position: absolute;
      top: -40%;
      right: -20%;
      width: 220px;
      height: 220px;
      background: radial-gradient(circle, rgba(232,73,15,0.6), rgba(232,73,15,0.15) 55%, transparent 70%);
      filter: blur(10px);
    }

    .stat-label {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-bottom: 10px;
      position: relative;
    }
    .stat-card.hero .stat-label { color: rgba(255,255,255,0.65); }

    .stat-value {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 2.1rem;
      font-variant-numeric: tabular-nums;
      position: relative;
    }

    .stat-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 6px;
      position: relative;
    }
    .stat-card.hero .stat-sub { color: rgba(255,255,255,0.55); }
    .stat-sub.up { color: var(--success); }
    .stat-card.hero .stat-sub.up { color: #6be3a0; }

    /* ── PANELS ── */
    .panels-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .panel {
      background: var(--white);
      border-radius: 14px;
      padding: 24px;
      border: 1px solid var(--border);
    }

    .panel h2 {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: 4px;
    }
    .panel .panel-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 18px;
    }
    .chart-wrap { height: 240px; }

    /* ── TABLE ── */
    .table-panel {
      background: var(--white);
      border-radius: 14px;
      padding: 24px;
      border: 1px solid var(--border);
    }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      text-align: left;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      padding: 8px 10px;
      border-bottom: 1.5px solid var(--border);
    }
    tbody td {
      padding: 12px 10px;
      font-size: 0.88rem;
      border-bottom: 1px solid var(--border);
    }
    tbody tr:last-child td { border-bottom: none; }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 700;
    }
    .badge.password { background: #DCE8FD; color: #1d4ed8; }
    .badge.google { background: #FEE9DC; color: var(--orange); }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.88rem;
      padding: 40px 10px;
    }

    .loading-note {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      padding: 60px 20px;
    }

    .unauthorized {
      max-width: 420px;
      margin: 100px auto;
      text-align: center;
      background: var(--white);
      border-radius: 14px;
      padding: 40px 32px;
      border: 1px solid var(--border);
    }
    .unauthorized h2 { font-family: 'Montserrat', sans-serif; margin-bottom: 8px; }
    .unauthorized p { color: var(--text-muted); font-size: 0.9rem; }

    /* ── FOOTER ── */
    footer {
      background: var(--dark);
      color: rgba(255,255,255,0.4);
      text-align: center;
      padding: 18px 48px;
      font-size: 0.82rem;
      flex-shrink: 0;
    }
    footer span { color: var(--orange); }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      nav { padding: 0 20px; }
      .main { padding: 28px 20px 40px; }
    }
    @media (max-width: 480px) {
      nav { padding: 0 16px; height: 60px; }
      .nav-brand { font-size: 0.92rem; }
      .nav-brand svg { width: 22px; height: 22px; }
      .nav-right a { font-size: 0.85rem; }
      .btn-logout-nav { padding: 6px 14px; }
      .main { padding: 24px 14px 32px; }
      .topbar h1 { font-size: 1.4rem; }
      footer { padding: 16px 20px; font-size: 0.78rem; }
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav>
    <a href="https://tharshi-peiris.github.io/new/" class="nav-brand">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2C6.48 2 2 6.48 2 12c0 3.54 1.84 6.65 4.6 8.44C7.5 15.5 10 13 10 10c1 2 3 4 3 7a8 8 0 1 0-1-15z"/>
      </svg>
      Premium Charcoal Co.
    </a>
    <div class="nav-right">
      <a href="https://tharshi-peiris.github.io/new/">View Site</a>
      <a href="#" id="logoutLink" class="btn-logout-nav">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h6v18h-6M10 17l5-5-5-5M3 12h12"/>
        </svg>
        Log Out
      </a>
    </div>
  </nav>

  <div class="main" id="main">
    <div class="topbar">
      <div>
        <h1>Overview</h1>
        <p>Sign-ups and activity for Premium Charcoal Co.</p>
      </div>
      <div id="whoami"></div>
    </div>

    <div id="content">
      <p class="loading-note">Loading dashboard data…</p>
    </div>
  </div>

  <footer>
    <p>© 2024 <span>Premium Charcoal Co.</span> — All rights reserved.</p>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAXXfVgDZkjJ5-DwcP5PjZACuMJfnUv_AA",
      authDomain: "tharushi-8b869.firebaseapp.com",
      projectId: "tharushi-8b869",
      storageBucket: "tharushi-8b869.firebasestorage.app",
      messagingSenderId: "265329735348",
      appId: "1:265329735348:web:8263202e454044fd2549e1",
      measurementId: "G-M4W3RTE0DZ"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const HOME_URL = 'https://tharshi-peiris.github.io/new/';

    // ── EDIT THIS: only these emails can view the dashboard ──
    // (Convenience check only — pair with Firestore security rules so
    // this is actually enforced server-side too, see chat notes.)
    const ADMIN_EMAILS = ['sasankap299@gmail.com, tharushipeiris5@gmail.com'];

    document.getElementById('logoutLink').addEventListener('click', async (e) => {
      e.preventDefault();
      await signOut(auth);
      window.location.href = 'login.html';
    });

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.replace('login.html');
        return;
      }
      document.body.style.visibility = 'visible';
      document.getElementById('whoami').innerHTML = `Signed in as <b>${escapeHtml(user.email)}</b>`;

      if (!ADMIN_EMAILS.includes(user.email)) {
        document.getElementById('main').innerHTML = `
          <div class="unauthorized">
            <h2>Not authorized</h2>
            <p>This account isn't on the dashboard access list. Add your email to ADMIN_EMAILS in dashboard.html to view this page.</p>
          </div>`;
        return;
      }

      try {
        await loadDashboard();
      } catch (err) {
        console.error(err);
        document.getElementById('content').innerHTML =
          `<p class="loading-note">Couldn't load data: ${escapeHtml(err.message)}</p>`;
      }
    });

    function escapeHtml(str) {
      const d = document.createElement('div');
      d.textContent = str ?? '';
      return d.innerHTML;
    }

    function dateKey(d) {
      return d.toISOString().slice(0, 10); // YYYY-MM-DD
    }

    function lastNDays(n) {
      const days = [];
      const today = new Date();
      for (let i = n - 1; i >= 0; i--) {
        const d = new Date(today);
        d.setDate(d.getDate() - i);
        days.push(dateKey(d));
      }
      return days;
    }

    function formatShortDate(key) {
      const d = new Date(key + 'T00:00:00');
      return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    }

    async function loadDashboard() {
      const usersSnap = await getDocs(collection(db, 'users'));
      const users = [];
      usersSnap.forEach(d => users.push({ id: d.id, ...d.data() }));

      const loginsSnap = await getDocs(collection(db, 'logins'));
      const logins = [];
      loginsSnap.forEach(d => logins.push({ id: d.id, ...d.data() }));

      const days = lastNDays(14);
      const signupsByDay = Object.fromEntries(days.map(k => [k, 0]));
      const loginsByDay = Object.fromEntries(days.map(k => [k, 0]));

      users.forEach(u => {
        if (u.createdAt?.toDate) {
          const k = dateKey(u.createdAt.toDate());
          if (k in signupsByDay) signupsByDay[k]++;
        }
      });

      logins.forEach(l => {
        if (l.timestamp?.toDate) {
          const k = dateKey(l.timestamp.toDate());
          if (k in loginsByDay) loginsByDay[k]++;
        }
      });

      const todayKey = dateKey(new Date());
      const loginsToday = loginsByDay[todayKey] || 0;
      const signupsToday = signupsByDay[todayKey] || 0;
      const loginsThisWeek = lastNDays(7).reduce((sum, k) => sum + (loginsByDay[k] || 0), 0);

      const recent = [...users].sort((a, b) => {
        const ta = a.createdAt?.toDate ? a.createdAt.toDate().getTime() : 0;
        const tb = b.createdAt?.toDate ? b.createdAt.toDate().getTime() : 0;
        return tb - ta;
      }).slice(0, 10);

      renderContent({
        totalUsers: users.length,
        signupsToday,
        loginsToday,
        loginsThisWeek,
        days,
        signupsByDay,
        loginsByDay,
        recent
      });
    }

    function renderContent(data) {
      document.getElementById('content').innerHTML = `
        <div class="stats-grid">
          <div class="stat-card hero">
            <div class="stat-label">Total Sign-Ups</div>
            <div class="stat-value">${data.totalUsers}</div>
            <div class="stat-sub">All-time registered accounts</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Sign-Ups Today</div>
            <div class="stat-value">${data.signupsToday}</div>
            <div class="stat-sub ${data.signupsToday > 0 ? 'up' : ''}">New accounts created today</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Logins Today</div>
            <div class="stat-value">${data.loginsToday}</div>
            <div class="stat-sub ${data.loginsToday > 0 ? 'up' : ''}">Sign-ins recorded today</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Logins This Week</div>
            <div class="stat-value">${data.loginsThisWeek}</div>
            <div class="stat-sub">Last 7 days</div>
          </div>
        </div>

        <div class="panels-grid">
          <div class="panel">
            <h2>Sign-ups per day</h2>
            <p class="panel-sub">Last 14 days</p>
            <div class="chart-wrap"><canvas id="signupsChart"></canvas></div>
          </div>
          <div class="panel">
            <h2>Logins per day</h2>
            <p class="panel-sub">Last 14 days</p>
            <div class="chart-wrap"><canvas id="loginsChart"></canvas></div>
          </div>
        </div>

        <div class="table-panel">
          <h2 style="font-family:'Montserrat',sans-serif;font-weight:700;font-size:1rem;margin-bottom:16px;">Recent sign-ups</h2>
          ${data.recent.length ? `
            <table>
              <thead><tr><th>Name</th><th>Email</th><th>Method</th><th>Signed up</th></tr></thead>
              <tbody>
                ${data.recent.map(u => `
                  <tr>
                    <td>${escapeHtml(((u.fname || '') + ' ' + (u.lname || '')).trim() || '—')}</td>
                    <td>${escapeHtml(u.email || '—')}</td>
                    <td><span class="badge ${u.provider === 'google' ? 'google' : 'password'}">${u.provider === 'google' ? 'Google' : 'Email'}</span></td>
                    <td>${u.createdAt?.toDate ? u.createdAt.toDate().toLocaleString() : '—'}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          ` : '<p class="empty-state">No sign-ups yet.</p>'}
        </div>
      `;

      const labels = data.days.map(formatShortDate);
      const chartFont = { family: 'Open Sans' };

      new Chart(document.getElementById('signupsChart'), {
        type: 'bar',
        data: {
          labels,
          datasets: [{
            data: data.days.map(k => data.signupsByDay[k]),
            backgroundColor: '#E8490F',
            borderRadius: 4,
            maxBarThickness: 22
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { display: false }, ticks: { font: chartFont } },
            y: { beginAtZero: true, ticks: { precision: 0, font: chartFont }, grid: { color: '#f0f0f0' } }
          }
        }
      });

      new Chart(document.getElementById('loginsChart'), {
        type: 'line',
        data: {
          labels,
          datasets: [{
            data: data.days.map(k => data.loginsByDay[k]),
            borderColor: '#111111',
            backgroundColor: 'rgba(17,17,17,0.06)',
            fill: true,
            tension: 0.35,
            pointRadius: 3,
            pointBackgroundColor: '#111111'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { display: false }, ticks: { font: chartFont } },
            y: { beginAtZero: true, ticks: { precision: 0, font: chartFont }, grid: { color: '#f0f0f0' } }
          }
        }
      });
    }
  </script>

</body>
</html>
